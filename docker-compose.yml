services:
  postgres:
    image: postgres:16-alpine
    container_name: igniteddreams-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-igniteddreams}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published on the host: only the backend container talks to the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igniteddreams-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-igniteddreams}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env}
      CLEANUP_SECRET: ${CLEANUP_SECRET:?Set CLEANUP_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL e.g. https://www.igniteddreams.com}
      BACKEND_URL: ${FRONTEND_URL}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-igniteddreams-recordings}
      R2_ENDPOINT: ${R2_ENDPOINT}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      ACADEMY_NAME: ${ACADEMY_NAME:-Ignited Dreams Integrated}
      ACADEMY_TIMEZONE: ${ACADEMY_TIMEZONE:-Asia/Kolkata}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-7}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-730}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_INSTRUCTOR_EMAIL: ${SEED_INSTRUCTOR_EMAIL}
      SEED_INSTRUCTOR_PASSWORD: ${SEED_INSTRUCTOR_PASSWORD}
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public site URL: Nginx routes /api to the backend on the same domain
        NEXT_PUBLIC_API_URL: ${FRONTEND_URL}
    container_name: igniteddreams-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${FRONTEND_URL}
      # Server-side rendering talks to the backend over the internal Docker network
      API_INTERNAL_URL: http://backend:5000
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    container_name: igniteddreams-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    driver: local
